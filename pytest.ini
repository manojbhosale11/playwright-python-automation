[pytest]
testpaths = tests
addopts = -ra --strict-markers --tracing=retain-on-failure --screenshot=only-on-failure --video=retain-on-failure --output=test-results

markers =
    smoke: critical tests for basic application functionality
    regression: tests for validating existing application behavior
    products: product listing and product interaction tests
    cart: shopping cart tests
    sorting: product sorting tests
    checkout: customer information, order summary and purchase tests